      prefix: /usr
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
# Custom compilers
  llvm:
    externals:
    - spec: llvm@18.1.8+clang~flang+lld+lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  intel-oneapi-compilers:
    externals:
    - spec: intel-oneapi-compilers@2025.2.0
      prefix: /uufs/chpc.utah.edu/sys/spack/v10/linux-rocky8-nehalem/none-none/intel-oneapi-compilers-2025.2.0-s4wycbbf36id66gbqm3vplz357n2jrok
      extra_attributes:
        compilers:
          c: /uufs/chpc.utah.edu/sys/spack/v10/linux-rocky8-nehalem/none-none/intel-oneapi-compilers-2025.2.0-s4wycbbf36id66gbqm3vplz357n2jrok/compiler/2025.2/bin/icx
          cxx: /uufs/chpc.utah.edu/sys/spack/v10/linux-rocky8-nehalem/none-none/intel-oneapi-compilers-2025.2.0-s4wycbbf36id66gbqm3vplz357n2jrok/compiler/2025.2/bin/icpx
          fortran: /uufs/chpc.utah.edu/sys/spack/v10/linux-rocky8-nehalem/none-none/intel-oneapi-compilers-2025.2.0-s4wycbbf36id66gbqm3vplz357n2jrok/compiler/2025.2/bin/ifx

# CHPC custom packages  
  slurm:
    buildable: false
    externals:
    - spec: slurm@24.11.5 arch=linux-rocky8-x86_64
      prefix: /uufs/notchpeak.peaks/sys/installdir/slurm/24.11.5
  # For MPIs that use IB, use the system RDMA
  rdma-core:
    buildable: False
    externals:
    - spec: rdma-core@35.0 arch=linux-rocky8-x86_64
      prefix: /usr
