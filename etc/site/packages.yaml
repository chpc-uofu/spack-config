# -------------------------------------------------------------------------
# This file controls default concretization preferences for Spack.
#
# Settings here are versioned with Spack and are intended to provide
# sensible defaults out of the box. Spack maintainers should edit this
# file to keep it current.
#
# Users can override these settings by editing the following files.
#
# Per-spack-instance settings (overrides defaults):
#   $SPACK_ROOT/etc/spack/packages.yaml
#
# Per-user settings (overrides default and site settings):
#   ~/.spack/packages.yaml
# -------------------------------------------------------------------------
packages:
  all:
    providers:
      awk: [gawk]
      armci: [armcimpi]
      blas: [openblas, intel-oneapi-mkl, amdblis]
      c: [gcc, llvm, intel-oneapi-compilers]
      cxx: [gcc, llvm, intel-oneapi-compilers, nvhpc]
      D: [ldc]
      daal: [intel-oneapi-daal]
      elf: [elfutils]
      fftw-api: [fftw, amdfftw]
      flame: [libflame, amdlibflame]
      fortran: [gcc, llvm, intel-oneapi-compilers, nvhpc]
      fortran-rt: [gcc-runtime, intel-oneapi-runtime]
      fuse: [libfuse]
      gl: [glx, osmesa]
      glu: [mesa-glu, openglu]
      golang: [go, gcc]
      go-or-gccgo-bootstrap: [go-bootstrap, gcc]
      iconv: [libiconv]
      ipp: [intel-oneapi-ipp]
      java: [openjdk, jdk]
      jpeg: [libjpeg-turbo, libjpeg]
      lapack: [openblas, intel-oneapi-mkl, amdlibflame]
      libc: [glibc, musl]
      libgfortran: [gcc-runtime]
      libglx: [mesa+glx]
      libifcore: [intel-oneapi-runtime]
      libllvm: [llvm]
      lua-lang: [lua, lua-luajit-openresty, lua-luajit]
      luajit: [lua-luajit-openresty, lua-luajit]
      mariadb-client: [mariadb-c-client, mariadb]
      mkl: [intel-oneapi-mkl]
      mpe: [mpe2]
      mpi: [openmpi, intel-oneapi-mpi, mvapich2, mpich]
      mysql-client: [mysql, mariadb-c-client]
      opencl: [pocl]
      onedal: [intel-oneapi-dal]
      pbs: [openpbs, torque]
      pil: [py-pillow]
      pkgconfig: [pkgconf, pkg-config]
      qmake: [qt-base, qt]
      rpc: [libtirpc]
      scalapack: [netlib-scalapack, intel-oneapi-mkl, amdscalapack]
      sycl: [hipsycl]
      szip: [libaec, libszip]
      tbb: [intel-tbb]
      unwind: [libunwind]
      uuid: [util-linux-uuid, libuuid]
      wasi-sdk: [wasi-sdk-prebuilt]
      xkbdata-api: [xkeyboard-config, xkbdata]
      xxd: [xxd-standalone, vim]
      yacc: [bison, byacc]
      ziglang: [zig]
      zlib-api: [zlib-ng+compat, zlib]
    permissions:
      read: world
      write: user
  cce:
    buildable: false
  cray-fftw:
    buildable: false
  cray-libsci:
    buildable: false
  cray-mpich:
    buildable: false
  cray-mvapich2:
    buildable: false
  cray-pmi:
    buildable: false
  egl:
    buildable: false
  essl:
    buildable: false
  fj:
    buildable: false
  fujitsu-mpi:
    buildable: false
  fujitsu-ssl2:
    buildable: false
  glibc:
    buildable: false
  hpcx-mpi:
    buildable: false
  iconv:
    prefer: [libiconv]
  mpt:
    buildable: false
  musl:
    buildable: false
  spectrum-mpi:
    buildable: false
  xl:
    buildable: false
  curl:
    externals:
    - spec: curl@7.61.1+gssapi+ldap+nghttp2
      prefix: /usr
  groff:
    externals:
    - spec: groff@1.22.3
      prefix: /usr
  automake:
    buildable: false
    externals:
    - spec: automake@1.16.1
      prefix: /usr
  findutils:
    externals:
    - spec: findutils@4.6.0
      prefix: /usr
  m4:
    buildable: false
    externals:
    - spec: m4@1.4.18
      prefix: /usr
  binutils:
    externals:
    - spec: binutils@2.30.119~gold~headers
      prefix: /usr
  cairo:
    externals:
    - spec: cairo@1.15.12
      prefix: /usr
  cmake:
    externals:
    - spec: cmake@3.20.2
      prefix: /usr
  tar:
    externals:
    - spec: tar@1.30
      prefix: /usr
  graphite2:
    externals:
    - spec: graphite2@1.3.10
      prefix: /usr
  texinfo:
    externals:
    - spec: texinfo@6.5
      prefix: /usr
  coreutils:
    externals:
    - spec: coreutils@8.30
      prefix: /usr
  npm:
    externals:
    - spec: npm@6.14.16
      prefix: /usr
  openssl:
    buildable: false
    externals:
    - spec: openssl@1.1.1k
      prefix: /usr
  libtool:
    externals:
    - spec: libtool@2.4.6
      prefix: /usr
  sed:
    externals:
    - spec: sed@4.5
      prefix: /usr
  git:
    externals:
    - spec: git@2.39.3~tcltk
      prefix: /usr
  gettext:
    externals:
    - spec: gettext@0.19.8.1
      prefix: /usr
  bison:
    externals:
    - spec: bison@3.0.4
      prefix: /usr
  libtirpc:
    externals:
    - spec: libtirpc@1.1.4
      prefix: /usr
  pango:
    externals:
    - spec: pango@1.42.4
      prefix: /usr
  proj:
    externals:
    - spec: proj@6.3.2
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.0p1
      prefix: /usr
  subversion:
    externals:
    - spec: subversion@1.10.2
      prefix: /usr
  python:
    externals:
    - spec: python@2.7.18+bz2+crypt+ctypes+dbm~lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib
      prefix: /usr
    - spec: python@3.6.8+bz2+crypt+ctypes+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib
      prefix: /usr
  zlib:
    externals:
    - spec: zlib@1.2.11
      prefix: /usr
  gawk:
    externals:
    - spec: gawk@4.2.1
      prefix: /usr
  autoconf:
    buildable: false
    externals:
    - spec: autoconf@2.69
      prefix: /usr
  gmake:
    externals:
    - spec: gmake@4.2.1
      prefix: /usr
  diffutils:
    externals:
    - spec: diffutils@3.6
      prefix: /usr
  pkgconf:
    externals:
    - spec: pkgconf@1.4.2
      prefix: /usr
  flex:
    buildable: false
    externals:
